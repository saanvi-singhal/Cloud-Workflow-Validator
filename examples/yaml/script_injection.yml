# Valid, but an issue title is pasted into a shell script before it runs.
# Expect a GHA_SCRIPT_INJECTION warning; the fix passes it through env.
name: Triage
on:
  issues:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "New issue: ${{ github.event.issue.title }}"
