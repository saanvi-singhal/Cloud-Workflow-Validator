<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Check GitHub Actions workflows, Dockerfiles and Terraform before you deploy: a verdict, every issue with its fix, and a dependency graph." />
    <meta name="theme-color" content="#0b7a75" />
    <title>Cloud Workflow Validator</title>
    <script>
      // Apply a saved light/dark choice before the first paint (see useTheme.ts).
      try {
        var t = localStorage.getItem('cwv-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
